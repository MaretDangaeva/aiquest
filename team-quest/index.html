2px;padding:9px 11px;font-size:13px}.member .avatar{font-size:21px}.member .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member em{color:var(--mint);font-style:normal;font-size:12px}.progress{height:10px;background:#263352;border-radius:40px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#7cf7d7,#7caaff);transition:width .25s}.progressline{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;margin:10px 0}.tasks{display:grid;gap:12px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 18px}.step{font-size:12px;text-align:center;background:#15223d;border:1px solid #344862;padding:9px 4px;border-radius:11px;color:#b7c7e3}.step.now{background:#134655;border-color:var(--mint);color:#e3fff8}.step.done{color:#a7ffd8;background:#1c3b48}.play-area{margin-top:17px}.pads{display:grid;grid-template-columns:repeat(2,minmax(0,150px));gap:12px;justify-content:center;margin:22px auto}.pad{height:105px;border:2px solid #ffffff5c;border-radius:20px;font-size:45px;background:#384d72;transition:.16s;box-shadow:inset 0 -7px #0002}.pad[data-i="0"]{background:#4b4a9a}.pad[data-i="1"]{background:#1b7576}.pad[data-i="2"]{background:#90633e}.pad[data-i="3"]{background:#8c456e}.pad.glow{filter:brightness(1.8);transform:scale(1.07);box-shadow:0 0 25px #c7fff8}.pad:disabled{opacity:.75}.cells{display:flex;justify-content:center;gap:7px;margin:10px}.cells i{display:block;border-radius:100%;width:15px;height:15px;background:#405577}.cells i.ok{background:var(--mint)}.sortbox{background:#1f2b4a;border:1px solid #647a9b;border-radius:22px;padding:26px;text-align:center;max-width:470px;margin:18px auto;position:relative;animation:pop .2s both}.sortbox .symbol{font-size:63px;display:block;margin-bottom:4px}.dropzones{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.drop{border:2px dashed #6f99bb;min-height:103px;min-width:160px;flex:1;max-width:250px;padding:12px;border-radius:18px;background:#153149;color:white;font-weight:800}.drop:hover{border-color:var(--mint);background:#225365}.drop b{display:block;font-size:30px}.toast{position:fixed;z-index:30;bottom:24px;left:50%;transform:translateX(-50%);background:#e8fff6;color:#102b35;border-radius:14px;padding:13px 22px;font-size:14px;font-weight:850;box-shadow:0 20px 50px #0008;text-align:center;max-width:min(600px,95vw);visibility:hidden}.toast.show{visibility:visible;animation:pop .15s}.maze{--size:clamp(32px,7vw,59px);display:grid;grid-template-columns:repeat(8,var(--size));width:max-content;max-width:100%;margin:18px auto 24px;gap:4px;touch-action:manipulation}.tile{display:grid;place-items:center;width:var(--size);height:var(--size);border-radius:9px;background:#345273;border:1px solid #6c91a6;font-size:clamp(16px,4.1vw,28px);position:relative}.tile.wall{background:repeating-linear-gradient(40deg,#263454,#263454 8px,#293b5c 8px,#293b5c 16px);border-color:#465c74}.tile.exit{background:#33654b}.tile.robot{box-shadow:0 0 0 3px var(--mint),0 0 18px #76f7d58a;z-index:2}.tile.next{box-shadow:inset 0 0 0 3px #ffe59d}.controls{display:flex;justify-content:center;gap:11px;flex-wrap:wrap}.arrow{background:#385477;border:1px solid #81a4ce;border-radius:13px;width:78px;height:65px;font-size:33px;color:white}.arrow:not(:disabled):active{transform:scale(.92)}.count{font-size:48px;font-weight:950;color:var(--yellow);font-variant-numeric:tabular-nums}.launch{display:grid;place-items:center;text-align:center;padding:25px 10px}.launch-core{width:165px;height:165px;border-radius:50%;background:radial-gradient(circle,#f9fff4,#90efca 20%,#267e93 55%,#12284f 75%);box-shadow:0 0 50px #39dfd858;display:grid;place-items:center;font-size:72px;margin:16px}.launch-core.pulse{animation:pulse 1.3s infinite}.round{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:16px}.round span{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#32435c;bord <body><div class="shell"><header class="top"><div class="brand">❄️ ПОЛЯРНАЯ <span>СТАНЦИЯ</span></div><div class="status"><i class="dot" id="onlineDot"></i><span id="onlineText">Ожидание команды</span></div></header><div class="grid"><main id="main"></main><aside class="side" id="side"></aside></div><div class="foot">Новогодняя командная игра об искусственном интеллекте · 2–10 игроков · 20–30 минут<br>Не вводите фамилии и личные данные. Ведущий должен держать вкладку открытой.</div></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="signalOverlay" style="display:none;position:fixed;inset:0;z-index:26;place-items:center;background:#071123ed;backdrop-filter:blur(8px)"><div style="text-align:center"><div class="eyebrow">Запоминай последовательность</div><div id="signalSymbol" style="font-size:clamp(100px,30vw,200px);filter:drop-shadow(0 0 40px #7affde)">👀</div></div></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), MAIN=$('main'),SIDE=$('side');
const ROLES=[['scout','🛰️','Разведчик','Видит путь вперёд','maze','🔦 Подсветить шаг'],['trainer','🧠','Тренер ИИ','Чистит данные','sort','✨ Исправить пример'],['designer','🎨','Промпт-мастер','Создаёт подсказки','memory','🪄 Два шага сигнала'],['navigator','🧭','Навигатор','Ведёт робота','maze','🧭 Автошаг'],['guardian','🛡️','Страж данных','Защищает команду','sort','🛡️ Исправить пример'],['engineer','🔧','Инженер','Чинит механизмы','maze','🔧 Автошаг'],['checker','🔎','Фактчекер','Находит шум','sort','🔎 Исправить пример'],['energy','⚡','Энергетик','Даёт запас времени','launch','⚡ +8 секунд'],['decoder','🧩','Дешифровщик','Помнит сигналы','memory','🧩 Два шага сигнала'],['radio','📡','Связист','Усиливает связь','launch','📡 +8 секунд']];
const ICONS=['❄️','⭐','🎁','🔔'];const STEPS=[['📡','Радиоволна'],['🧠','Датасет'],['🤖','Лабиринт'],['🚀','Запуск']];
const SAMPLES=[['🎁','Фото подарка','keep'],['❄️','Чёткая снежинка','keep'],['🎄','Размеченная ёлка','keep'],['⛄','Снеговик с меткой','keep'],['🔁','100 одинаковых фото','trash'],['🔒','Чужой пароль','trash'],['❓','Картинка без метки','trash'],['🎭','Неверная подпись','trash'],['🌟','Фото со звездой','keep'],['📸','Совсем размыто','trash'],['🧸','Игрушка с меткой','keep'],['🗑️','Сломанный файл','trash'],['🥇','Верная категория','keep'],['🤖','Личные данные','trash'],['🔍','Чёткое изображение','keep'],['🚫','Ошибочная метка','trash'],['🎯','Новый пример','keep'],['📋','Дубликат записи','trash'],['🛷','Сани с меткой','keep'],['🧊','Фото льда с меткой','keep']];
const W=8,H=6,WALLS=new Set(['2,5','2,4','4,4','4,3','1,2','2,2','5,2','6,2','5,1','3,0']),CORES=['1,3','4,2','6,1'],END='7,0';
const DIRS=[['↑',0,-1],['→',1,0],['↓',0,1],['←',-1,0]];
let mode='intro',peer=null,conn=null,connections=new Map(),me=null,host=false,room='',state=null,personal=null,connected=false;
let signalAnimation=false,noticeTimer=0,scanHint='',recaptchaTimer=null,clockTimer=null,connectionTimeout=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const newState=()=>({stage:'lobby',players:[],memory:{},sort:{},maze:{x:0,y:5,cores:[],moves:0},launch:{step:0,deadline:0,misses:0},used:{},message:'',startedAt:0});
const role=id=>ROLES.find(r=>r[0]===id),player=id=>state?.players.find(p=>p.id===id);
const stages=['memory','sort','maze','launch'];
const link=()=>{const url=new URL(location.href);url.searchParams.set('room',room);return url.toString()};
function notify(msg){const n=$('toast');n.textContent=msg;n.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.remove('show'),2900)}
function button(txt,fn,cls=''){return `<button class="btn ${cls}" data-act="${fn}">${txt}</button>`}
function setStatus(text,on=false){$('onlineText').textContent=text;$('onlineDot').classList.toggle('on',on)}
function init(){const params=new URLSearchParams(location.search);room=(params.get('room')||'').replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase();render()}
function panel(content,extra=''){return `<section class="card ${extra}">${content}</section>`}
function render(){MAIN.innerHTML='';SIDE.innerHTML='';if(mode==='intro')renderIntro();else if(mode==='host'&&state)renderGame();else if(mode==='guest'&&(!connected||!state))renderWait();else if(state)renderGame();else renderWait()}
function renderIntro(){MAIN.innerHTML=panel(`<div class="eyebrow">Новогодний квест · курс ИИ · 5–9 классы</div><h1>Полярная станция<br>под угрозой! ❄️</h1><p class="big">ИИ забыл, как включить северное сияние. Восстановите сигнал <strong>всей командой</strong>!</p><div class="scene">🏔️</div><div class="button-row">${button('🎮 Создать комнату','create')}${room?button('🔗 Присоединиться','joinScreen','secondary'):''}</div><p class="tiny" style="margin-top:14px">Каждый выбирает одну из 10 ролей. Работает на телефонах и компьютерах.</p>`,'hero');SIDE.innerHTML=panel(`<h3>Как играть</h3><div class="tasks"><div>1️⃣ Ведущий создаёт комнату</div><div>2️⃣ Ученики открывают одну ссылку</div><div>3️⃣ Каждый занимает свою роль</div><div>4️⃣ Вместе запускаете сияние ✨</div></div>`)+panel(`<span class="tag">4 миссии</span><p style="margin-top:12px">🔊 Повторите сигнал<br>🧠 Очистите данные<br>🤖 Проведите робота<br>🚀 Синхронно запустите станцию</p>`)}
function renderWait(){MAIN.innerHTML=panel(`<div class="eyebrow">Комната ${esc(room||'')}</div><h1 style="font-size:38px">Подключаемся 📡</h1><p class="big" id="waitText">Проверяем связь с ведущим…</p>${button('↩ На главную','home','secondary')}`);SIDE.innerHTML=panel(`<h3>Для группы</h3><p>Не закрывайте страницу. Участники появятся здесь после подключения.</p>`)}
function renderSide(){const ppl=state.players;const done=stages.indexOf(state.stage);const roster=ppl.map(p=>`<div class="member"><span class="avatar">${role(p.role)?.[1]||'👤'}</span><span class="name">${esc(p.name)}</span><em>${role(p.role)?.[2]||'Выбирает роль'}</em></div>`).join('');SIDE.innerHTML=panel(`<div class="split"><h3>👥 Команда</h3><span class="tag">${ppl.length}/10</span></div><div class="roster">${roster||'<p>Пока никого нет</p>'}</div>`)+panel(`<h3>💎 Энергия станции</h3><div class="progress"><span style="width:${state.stage==='win'?100:Math.max(0,done)*25}%"></span></div><div class="progressline"><span>Миссии</span><b>${state.stage==='win'?4:Math.max(0,done)} / 4</b></div><p class="tiny">Чем больше участников, тем веселее. Задания подстроятся под размер группы.</p>`)+(host?panel(`<h3>🎛️ Пульт ведущего</h3><div class="button-row">${button('↻ Новая игра','reset','secondary small')}${state.stage!=='lobby'&&state.stage!=='win'?button('⏭ Пропустить этап','skip','secondary small'):''}</div><p class="tiny" style="margin-top:11px">Оставьте эту вкладку открытой: через неё соединяется команда.</p>`):'')}
function renderGame(){setStatus(host?'Ведущий онлайн':(connected?'На связи':'Связь потеряна'),host||connected);renderSide();if(state.stage==='lobby')renderLobby();else if(state.stage==='win')renderWin();else renderMission()}
function renderLobby(){const occupants=new Map(state.players.filter(p=>p.role).map(p=>[p.role,p]));const current=player(me);const assigned=!!current?.role;const roles=ROLES.map(r=>{const owner=occupants.get(r[0]);return `<button class="role ${owner?'occupied':''} ${current?.role===r[0]?'selected':''}" data-act="claim" data-val="${r[0]}" ${host||owner&&owner.id!==me?'disabled':''}><span class="emoji">${r[1]}</span><b>${r[2]}</b><small>${owner?(owner.id===me?'✓ Ваша роль':esc(owner.name)):r[3]}</small></button>`}).join('');if(host){MAIN.innerHTML=panel(`<div class="eyebrow">🧑‍🏫 Кабинет ведущего</div><h1 style="font-size:42px">Собираем команду!</h1><p>Пригласите от <strong>2 до 10 игроков</strong>. Они сами выбирают роли.</p><div class="role-hint"><b>Ссылка для всех</b><div style="overflow-wrap:anywhere;margin:9px 0;color:#a4f4dc">${esc(link())}</div>${button('📋 Скопировать ссылку','copy','secondary small')}</div><div class="button-row">${button('🚀 Начать миссию','start',state.players.filter(p=>p.role).length<2?'secondary':'') }</div>${state.players.filter(p=>p.role).length<2?'<p class="tiny" style="margin-top:10px">Нужно минимум 2 участника с ролями.</p>':''}<h3 style="margin-top:24px">Доступные роли</h3><div class="role-grid">${roles}</div>`)}else if(!me){MAIN.innerHTML=panel(`<div class="eyebrow">Комната ${esc(room)}</div><h1 style="font-size:40px">Присоединяйся! 👋</h1><p>Напиши только имя или ник — без фамилии.</p><div class="form"><label>Твоё имя<input class="field" id="username" placeholder="Например, Лёша" maxlength="18" autocomplete="nickname"></label>${button('Далее →','setName')}</div>`)}else{MAIN.innerHTML=panel(`<div class="eyebrow">Комната ${esc(room)}</div><h1 style="font-size:39px">${assigned?'Роль занята!':'Выбери роль'} ${assigned?'✨':'🎭'}</h1><p>${assigned?'Можно поменять роль до начала игры.':'Один игрок — одна роль. Занятые роли недоступны.'}</p><div class="role-grid">${roles}</div>${assigned?'<div class="role-hint">✅ Ты в команде! Ждём запуска от ведущего.</div>':''}`)}}
function missionHeader(title,txt){const pos=stages.indexOf(state.stage);return `<div class="steps">${STEPS.map((s,i)=>`<span class="step ${i<pos?'done':i===pos?'now':''}">${s[0]} ${s[1]}</span>`).join('')}</div><div class="eyebrow">Миссия ${pos+1} из 4</div><h2>${title}</h2><p class="big">${txt}</p>`}
function renderMission(){let html='';const stage=state.stage;if(stage==='memory')html=renderMemory();if(stage==='sort')html=renderSort();if(stage==='maze')html=renderMaze();if(stage==='launch')html=renderLaunch();const rr=role(player(me)?.role);const skill=rr&&rr[4]===stage&&!state.used[me]?`<div class="role-hint">✨ Способность: <strong>${rr[5]}</strong> ${button('Применить','skill','yellow small')}</div>`:'';if(host){MAIN.innerHTML=panel(missionHeader(stage==='memory'?'📡 Поймай сигнал':stage==='sort'?'🧠 Обучи Снегобота':stage==='maze'?'🤖 Веди робота':'🚀 Запусти сияние',stage==='memory'?'Каждый запоминает свою мелодию и повторяет её.':stage==='sort'?'Каждый очищает свою часть данных для ИИ.':stage==='maze'?'Вы управляете одним роботом, но команды поделены между игроками.':'Нажимайте кнопку по очереди. Не упустите момент!')+html+`<div class="role-hint">👀 На экране ведущего — общий прогресс. Действия выполняют ученики на своих устройствах.</div>`)}else if(!me){MAIN.innerHTML=panel(`<h2>Подключение к миссии</h2><p>Игра уже началась. Попроси ведущего начать новую комнату.</p>`)}else MAIN.innerHTML=panel(missionHeader(stage==='memory'?'📡 Поймай сигнал':stage==='sort'?'🧠 Обучи Снегобота':stage==='maze'?'🤖 Проведи робота':'🚀 Запусти сияние',stage==='memory'?'Запомни световой код и повтори его по памяти.':stage==='sort'?'Перетащи карточку в нужный контейнер (или нажми кнопку).':stage==='maze'?'У каждого — свои кнопки управления. Договоритесь!':'Нажми, когда загорится твой ход.')+html+skill)}
function renderMemory(){const ppl=state.players.filter(p=>p.role), n=ppl.filter(p=>state.memory[p.id]?.done).length;const my=personal?.memory;const complete=my?.done;let output=`<div class="progressline"><span>Передано сигналов</span><b>${n} / ${ppl.length}</b></div><div class="progress"><span style="width:${ppl.length?100*n/ppl.length:0}%"></span></div>`;if(host)return output+`<div class="scene">${n===ppl.length?'✨':'📡'}</div><p style="text-align:center">${n===ppl.length?'Вся команда восстановила радиосигнал!':'Каждый ловит свою частоту.'}</p>`;if(!my)return '<p>Ждём выдачи сигнала…</p>';output+=`<div class="play-area"><div style="text-align:center"><span class="tag">Твоя личная частота</span><h3 style="margin:16px 0 0">${complete?'✨ Сигнал отправлен!':'Смотри — запоминай — нажимай'}</h3></div><div class="pads">${ICONS.map((ico,i)=>`<button class="pad" data-act="tap" data-val="${i}" data-i="${i}" ${complete?'disabled':''} aria-label="${['Снежинка','Звезда','Подарок','Колокольчик'][i]}">${ico}</button>`).join('')}</div><div class="cells">${my.seq.map((_,i)=>`<i class="${i<my.progress?'ok':''}"></i>`).join('')}</div><div class="button-row" style="justify-content:center">${button(complete?'✅ Готово':'👁️ Показать сигнал','show','secondary')}</div><p class="tiny" style="text-align:center;margin-top:14px">${complete?'Ждём остальных':'Нажми «Показать сигнал», затем повтори цветные кнопки'}</p></div>`;return output}
function renderSort(){const ppl=state.players.filter(p=>p.role),done=ppl.filter(p=>state.sort[p.id]?.done).length;let html=`<div class="progressline"><span>Данные очищены</span><b>${done} / ${ppl.length}</b></div><div class="progress"><span style="width:${ppl.length?100*done/ppl.length:0}%"></span></div>`;if(host)return html+`<div class="scene">${done===ppl.length?'🧠✨':'🗂️'}</div><p style="text-align:center">${done===ppl.length?'Набор данных готов!':'Команда избавляется от мусора и личных данных.'}</p>`;const mine=personal?.sort;if(!mine)return html+'<p>Получаем карточки…</p>';if(mine.done)return html+`<div class="scene">✅</div><p style="text-align:center">Твои карточки отсортированы! Ждём других.</p>`;const c=mine.cards[mine.index];if(!c)return html+'<p>Загружаем…</p>';return html+`<div class="sortbox" id="sortCard" draggable="true"><span class="symbol">${c[0]}</span><h2 style="margin:0">${esc(c[1])}</h2><span class="tag">Карточка ${mine.index+1} из ${mine.cards.length}</span></div><div class="dropzones"><button class="drop" data-act="sort" data-val="keep" id="keepzone"><b>✅</b>В датасет</button><button class="drop" data-act="sort" data-val="trash" id="trashzone"><b>🗑️</b>Удалить</button></div><p class="tiny" style="text-align:center;margin-top:12px">Для ИИ нужны качественные, размеченные и безопасные данные.</p>`}
function routePath(){const st=state.maze;const remaining=CORES.filter(c=>!st.cores.includes(c));let targets=remaining.length?remaining:[END];const start=`${st.x},${st.y}`,q=[start],seen=new Map([[start,null]]);while(q.length){const at=q.shift();if(targets.includes(at)){const path=[];let x=at;while(x!==start){const p=seen.get(x);path.unshift(x);x=p}return path}const [x,y]=at.split(',').map(Number);for(const [,dx,dy] of DIRS){const xx=x+dx,yy=y+dy,k=`${xx},${yy}`;if(xx<0||xx>=W||yy<0||yy>=H||WALLS.has(k)||seen.has(k))continue;seen.set(k,at);q.push(k)}}return []}
function directionsFor(id){const ppl=state.players.filter(p=>p.role),idx=ppl.findIndex(p=>p.id===id);if(idx<0)return [];if(ppl.length<=1)return [0,1,2,3];if(ppl.length===2)return idx===0?[0,2]:[1,3];if(ppl.length===3)return idx===0?[0,2]:idx===1?[1]:[3];return [idx%4]}
function renderMaze(){const m=state.maze,can=host?[]:directionsFor(me);const path=scanHint?routePath():[];const board=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>{const k=`${x},${y}`;return `<div class="tile ${WALLS.has(k)?'wall':''} ${k===END?'exit':''} ${m.x===x&&m.y===y?'robot':''} ${path[0]===k?'next':''}">${m.x===x&&m.y===y?'🤖':WALLS.has(k)?'':k===END?'🎄':CORES.includes(k)?(m.cores.includes(k)?'':'⚡'):''}</div>`}).join('')).join('');return `<div class="progressline"><span>Батарейки</span><b>${m.cores.length} / ${CORES.length} ⚡</b></div><div class="maze" role="img" aria-label="Ледяной лабиринт 8 на 6 клеток">${board}</div>${!host?`<div style="text-align:center"><h3>Твои кнопки</h3><div class="controls">${DIRS.map((d,i)=>`<button class="arrow" data-act="move" data-val="${i}" ${can.includes(i)?'':'disabled'} aria-label="${['Вверх','Вправо','Вниз','Влево'][i]}">${d[0]}</button>`).join('')}</div></div>`:`<p style="text-align:center">Игроки ведут одного робота. Соберите 3 батарейки и доберитесь до ёлки!</p>`}<div class="role-hint">${scanHint?'🔦 Следующий шаг подсвечен жёлтым!':'💡 Обходите льдины, собирайте ⚡ и двигайтесь к 🎄'}</div>`}
function renderLaunch(){const ppl=state.players.filter(p=>p.role),l=state.launch,next=ppl[l.step],iAm=next?.id===me;const icons=ppl.map((p,i)=>`<span class="${i<l.step?'done':i===l.step?'now':''}" title="${esc(p.name)}">${role(p.role)?.[1]||'🧑'}</span>`).join('');return `<div class="launch"><span class="tag">Финальная синхронизация</span><div class="launch-core ${iAm?'pulse':''}">🌌</div><h2>${next?esc(next.name)+' — твой ход!':'Сигнал принят!'}</h2><div class="count" id="countdown">${Math.max(0,Math.ceil((l.deadline-Date.now())/1000))} с</div><div class="round">${icons}</div>${!host?button(iAm?'⚡ ДАТЬ ИМПУЛЬС!':'⏳ Ждём очереди','launchTap',iAm?'yellow':'secondary'):''}<p style="margin-top:13px">${host?'Команда запускает северное сияние по очереди.':iAm?'Нажми сейчас — передай энергию следующему!':'Передайте сигнал по цепочке.'}</p><div class="tiny">Ошибок синхронизации: ${l.misses}</div></div>`}
function renderWin(){const time=state.startedAt?Math.max(1,Math.round((Date.now()-state.startedAt)/60000)):0;MAIN.innerHTML=panel(`<div class="eyebrow">Миссия выполнена</div><div class="fireworks">🌌🎆✨</div><h1 style="text-align:center">Сияние спасено!</h1><p class="big" style="text-align:center;margin:auto">Вы сделали невозможное: восстановили данные, научили ИИ, провели робота и объединили команду.</p><div style="text-align:center;margin:25px 0"><span class="tag">🏆 ${state.players.length} героев · 4 миссии</span></div><div class="button-row" style="justify-content:center">${host?button('🔁 Сыграть ещё раз','reset','secondary'):button('🎉 Поздравить команду','cheer','pink')}</div>`,'hero')}
function broadcast(){if(!host||!state)return;for(const [id,c] of connections){if(c.open)try{c.send({type:'state',state:publicState(),you:id,personal:personalFor(id)})}catch(e){}}render()}
function publicState(){return {stage:state.stage,players:state.players.map(({id,name,role})=>({id,name,role})),used:state.used,maze:state.maze,launch:state.launch,memory:Object.fromEntries(Object.entries(state.memory).map(([id,t])=>[id,{done:t.done}])),sort:Object.fromEntries(Object.entries(state.sort).map(([id,t])=>[id,{done:t.done}])),startedAt:state.startedAt}}
function personalFor(id){return {memory:state.memory[id]||null,sort:state.sort[id]||null}}
function hostMessage(id,msg){const p=player(id);if(!p&&msg.type!=='join')return;if(msg.type==='join'){if(state.stage!=='lobby'){sendOne(id,{type:'error',message:'Игра уже идёт. Попроси ведущего перезапустить квест.'});return}let name=String(msg.name||'Игрок').trim().slice(0,18).replace(/[<>]/g,'');if(!name)name='Игрок';if(!player(id)&&state.players.length>=10){sendOne(id,{type:'error',message:'Комната заполнена: максимум 10 игроков.'});return}if(!player(id))state.players.push({id,name,role:null});broadcast();return}
if(msg.type==='claim'&&state.stage==='lobby'){const idRole=String(msg.role);if(!role(idRole)||state.players.some(x=>x.role===idRole&&x.id!==id)){sendOne(id,{type:'error',message:'Эта роль уже занята'});return}p.role=idRole;broadcast();return}
if(!p.role)return;
if(msg.type==='memoryTap'&&state.stage==='memory'){const t=state.memory[id];if(!t||t.done)return;const v=Number(msg.i);if(v===t.seq[t.progress]){t.progress++;if(t.progress===t.seq.length)t.done=true}else{t.progress=0;sendOne(id,{type:'error',message:'Ой, волна сбилась. Попробуй ещё!'});}broadcast();checkComplete();return}
if(msg.type==='sort'&&state.stage==='sort'){const t=state.sort[id];if(!t||t.done)return;const expect=t.cards[t.index]?.[2];if(msg.value===expect){t.index++;if(t.index===t.cards.length)t.done=true}else sendOne(id,{type:'error',message:expect==='trash'?'Эту карточку лучше удалить!':'Это хороший пример — сохрани его.'});broadcast();checkComplete();return}
if(msg.type==='move'&&state.stage==='maze'){const i=Number(msg.i);if(!directionsFor(id).includes(i))return;performMove(i);return}
if(msg.type==='launchTap'&&state.stage==='launch'){const pList=state.players.filter(q=>q.role);if(pList[state.launch.step]?.id!==id||Date.now()>state.launch.deadline)return;state.launch.step++;state.launch.deadline=Date.now()+12000;if(state.launch.step>=pList.length){state.stage='win';notify('🎆 Сияние включено!')}broadcast();return}
if(msg.type==='skill'){useSkill(id);return}}
function sendOne(id,m){const c=connections.get(id);if(c?.open)try{c.send(m)}catch(e){}}
function checkComplete(){const ids=state.players.filter(p=>p.role).map(p=>p.id);if(state.stage==='memory'&&ids.every(id=>state.memory[id]?.done)||state.stage==='sort'&&ids.every(id=>state.sort[id]?.done)){const next=state.stage==='memory'?'sort':'maze';state.stage=next;if(next==='sort')initSort();broadcast();notify('🎉 Этап пройден!')}}
function seedOf(id){return [...id].reduce((n,c)=>n+c.charCodeAt(0),0)}
function initMemory(){state.memory={};for(const p of state.players.filter(x=>x.role)){const seed=seedOf(p.id);state.memory[p.id]={seq:Array.from(crypto.getRandomValues(new Uint8Array(4)),v=>v%4),progress:0,done:false}}}
function initSort(){state.sort={};const pList=state.players.filter(p=>p.role);for(let i=0;i<pList.length;i++){const good=SAMPLES.filter(c=>c[2]==='keep'),bad=SAMPLES.filter(c=>c[2]==='trash');const a=good[i%good.length],b=bad[(i*2)%bad.length],c=SAMPLES[(i*3+4)%SAMPLES.length];state.sort[pList[i].id]={cards:[a,b,c],index:0,done:false}}}
function performMove(i){const d=DIRS[i],m=state.maze,x=m.x+d[1],y=m.y+d[2],k=`${x},${y}`;if(x<0||x>=W||y<0||y>=H||WALLS.has(k)){notify('🧊 Айсберг! Ищите другой путь.');return}m.x=x;m.y=y;m.moves++;if(CORES.includes(k)&&!m.cores.includes(k)){m.cores.push(k);notify('⚡ Батарейка найдена!')}if(k===END&&m.cores.length===CORES.length){state.stage='launch';state.launch={step:0,deadline:Date.now()+12000,misses:0};notify('🚀 Робот у ёлки! Финальный запуск.')}else if(k===END)notify('🔋 Сначала найдите все 3 батарейки!');broadcast()}
function useSkill(id){const p=player(id),r=role(p?.role);if(!r||r[4]!==state.stage||state.used[id])return;state.used[id]=true;if(r[4]==='sort'){const t=state.sort[id];if(t&&!t.done){t.index++;if(t.index===t.cards.length)t.done=true;sendOne(id,{type:'error',message:'✨ Один пример очищен автоматически!'});checkComplete()}}else if(r[4]==='maze'){const path=routePath();if(path.length){const [x,y]=path[0].split(',').map(Number);const i=DIRS.findIndex(d=>d[1]===x-state.maze.x&&d[2]===y-state.maze.y);if(i>=0)performMove(i)}sendOne(id,{type:'hint',message:'Подсвечен кратчайший путь к следующей цели!'});}else if(r[4]==='launch'){state.launch.deadline+=8000;sendOne(id,{type:'error',message:'⚡ Команда получила +8 секунд!'});}else if(r[4]==='memory'){const t=state.memory[id];if(t&&!t.done){t.progress=Math.min(t.seq.length,t.progress+2);if(t.progress===t.seq.length)t.done=true;sendOne(id,{type:'error',message:'🧩 Два шага сигнала найдены!'});checkComplete();}}broadcast()}
function tick(){if(host&&state?.stage==='launch'&&Date.now()>state.launch.deadline){state.launch.step=0;state.launch.misses++;state.launch.deadline=Date.now()+12000;broadcast();notify('⏳ Время вышло! Начните цепочку заново.')}if(state?.stage==='launch'){const el=$('countdown');if(el)el.textContent=`${Math.max(0,Math.ceil((state.launch.deadline-Date.now())/1000))} с`}}
function setupHost(){host=true;mode='host';state=newState();me=null;connected=true;const url=new URL(location.href);url.searchParams.set('room',room);history.replaceState(null,'',url);if(typeof Peer==='undefined'){notify('Не удалось загрузить сетевую библиотеку. Проверь интернет.');return}peer=new Peer(`aurora-north-v2-${room.toLowerCase()}`,{debug:0});setStatus('Открываем комнату…');peer.on('open',()=>{setStatus('Комната открыта',true);render()});peer.on('connection',c=>{if(state.players.length>=10||state.stage!=='lobby'){c.on('open',()=>{c.send({type:'error',message:state.stage!=='lobby'?'Квест уже идёт.':'Все 10 мест заняты.'});setTimeout(()=>c.close(),800)});return}connections.set(c.peer,c);c.on('open',()=>{c.send({type:'hello'});broadcast()});c.on('data',msg=>{if(msg&&typeof msg==='object')hostMessage(c.peer,msg)});c.on('close',()=>{connections.delete(c.peer);if(state.stage==='lobby'){state.players=state.players.filter(p=>p.id!==c.peer)}else{ // disconnect later: keep role, allow teacher to skip mission
state.players=state.players.filter(p=>p.id!==c.peer);if(state.stage==='memory'||state.stage==='sort')checkComplete();if(state.stage==='launch'){state.launch.step=0;state.launch.deadline=Date.now()+12000}}
broadcast()})});peer.on('error',e=>{if(e.type==='unavailable-id'){notify('Комната уже существует. Создайте другую.');room=rand();peer.destroy();setupHost()}else{setStatus('Ошибка связи');notify('Не удалось открыть комнату: '+e.type)}});render()}
function setupGuest(){host=false;mode='guest';connected=false;state=null;me=null;render();if(typeof Peer==='undefined'){const el=$('waitText');if(el)el.textContent='Сетевая библиотека не загрузилась. Нужен интернет.';return}peer=new Peer();peer.on('open',()=>{conn=peer.connect(`aurora-north-v2-${room.toLowerCase()}`,{reliable:true});conn.on('open',()=>{connected=true;setStatus('На связи',true);conn.send({type:'hello'});render()});conn.on('data',msg=>{if(msg.type==='hello')return;if(msg.type==='state'){state=msg.state;personal=msg.personal;me=msg.you;render()}else if(msg.type==='error')notify(msg.message);else if(msg.type==='reveal'){notify(msg.message);showSignal()}else if(msg.type==='hint'){scanHint='on';render();setTimeout(()=>{scanHint='';render()},5000)}});conn.on('close',()=>{connected=false;setStatus('Связь потеряна');render();notify('Связь с ведущим потеряна. Обновите страницу.')});conn.on('error',()=>{notify('Не удаётся соединиться. Ведущий открыл комнату?')});connectionTimeout=setTimeout(()=>{if(!connected){const el=$('waitText');if(el)el.textContent='Не удаётся найти ведущего. Проверьте ссылку и попросите открыть комнату.'}},8500)});peer.on('error',e=>{setStatus('Ошибка сети');notify(e.type==='peer-unavailable'?'Комната не найдена. Ведущий должен открыть игру.':'Ошибка соединения: '+e.type)})}
function send(msg){if(!host&&conn?.open)conn.send(msg)}
function act(a,v){if(a==='create'){room=rand();setupHost();return}if(a==='joinScreen'){setupGuest();return}if(a==='home'){location.href=location.pathname;return}if(a==='copy'){navigator.clipboard?.writeText(link()).then(()=>notify('📋 Ссылка скопирована!')).catch(()=>{prompt('Скопируйте ссылку:',link())});return}if(a==='setName'){const input=$('username');if(!input)return;const name=input.value.trim().slice(0,18);if(!name){notify('Напиши имя или ник');return}sessionStorage.setItem('aurora-name-'+room,name);send({type:'join',name});return}if(a==='claim'){send({type:'claim',role:v});return}if(a==='start'&&host){if(state.players.filter(p=>p.role).length<2){notify('Нужно минимум 2 игрока с ролями');return}state.stage='memory';state.startedAt=Date.now();state.used={};initMemory();broadcast();notify('🎮 Квест начался!');return}if(a==='tap'&&state?.stage==='memory'&&!signalAnimation){send({type:'memoryTap',i:+v});return}if(a==='show'){showSignal();return}if(a==='sort'){send({type:'sort',value:v});return}if(a==='move'){send({type:'move',i:+v});return}if(a==='launchTap'){send({type:'launchTap'});return}if(a==='skill'){send({type:'skill'});return}if(a==='cheer'){notify('🎉 Ура! Вы отличная команда!');return}if(a==='reset'&&host){if(!confirm('Начать игру заново? Роли сохранятся.'))return;const old=state.players;state=newState();state.players=old.filter(p=>connections.get(p.id)?.open);broadcast();return}if(a==='skip'&&host){if(!confirm('Пропустить миссию для всей команды?'))return;const at=state.stage;state.stage=at==='memory'?'sort':at==='sort'?'maze':at==='maze'?'launch':'win';if(state.stage==='sort')initSort();if(state.stage==='launch')state.launch={step:0,deadline:Date.now()+12000,misses:0};broadcast();notify('⏭ Переходим дальше');return}}
function showSignal(){const my=personal?.memory;if(!my||my.done||signalAnimation)return;signalAnimation=true;const overlay=$('signalOverlay');overlay.style.display='grid';const out=$('signalSymbol');out.textContent='👀';let i=0;const sequence=my.seq;const timer=setInterval(()=>{if(i>=sequence.length){clearInterval(timer);out.textContent='🚀';setTimeout(()=>{overlay.style.display='none';signalAnimation=false},650);return}out.textContent=ICONS[sequence[i++]]},820)}
function handleKey(e){if(state?.stage==='maze'&&!host&&['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){const i=['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].indexOf(e.key);if(directionsFor(me).includes(i)){send({type:'move',i});e.preventDefault()}}if(e.key==='Enter'&&e.target?.id==='username')act('setName')}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(btn&&!btn.disabled)act(btn.dataset.act,btn.dataset.val)});document.addEventListener('keydown',handleKey);document.addEventListener('dragstart',e=>{if(e.target.id==='sortCard')e.dataTransfer.setData('text/plain','sample')});document.addEventListener('dragover',e=>{if(e.target.closest('.drop'))e.preventDefault()});document.addEventListener('drop',e=>{const z=e.target.closest('.drop');if(z){e.preventDefault();act('sort',z.dataset.val)}});setInterval(tick,280);init();
})();
