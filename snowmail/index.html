const TILE={0:['📮','Штаб','home'],1:['✨','Искры','star'],2:['🍬','Пряничный','town'],3:['🌨️','Метель','snow'],4:['✨','Искры','star'],5:['🏡','Снежный','town'],6:['🌨️','Метель','snow'],7:['✨','Искры','star'],8:['🎠','Ледяной','town'],9:['🌨️','Метель','snow'],10:['✨','Искры','star'],11:['🎄','Еловый','town']};

const PREFIX='snowmail-2026-v1-';const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const makeCode=()=>Math.random().toString(36).slice(2,8).toUpperCase();const makeToken=()=>{try{return Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')}catch{return Math.random().toString(36).slice(2)+Date.now()}};

 if(m.type==='join'){

 const t=c.playerToken,p=playerByToken(t);if(!p||connections.get(t)!==c)return;
 if(m.type==='claim'&&state.phase==='lobby'){
   const id=String(m.role||'');if(!role(id)||state.players.some(q=>q.role===id&&q.id!==p.id)){sendConn(t,{type:'error',text:'Роль уже занята!'});return}p.role=id;publish();return;
 }
 if(state.phase!=='playing'||state.players[state.turn]?.id!==p.id)return;
 if(m.type==='power')usePower(p);
 if(m.type==='play')playCard(p,m);
}
function connectGuest(name){guestName=name.trim().slice(0,18);if(!guestName){msg('Напиши своё имя');return}setup='connecting';if(typeof Peer==='undefined'){msg('Нужен интернет для подключения.');setup='guestgate';render();return}token=sessionStorage.getItem('snowmail-'+room)||makeToken();sessionStorage.setItem('snowmail-'+room,token);peer=new Peer({debug:0});status('Подключение…');peer.on('open',()=>{connection=peer.connect(PREFIX+room.toLowerCase(),{reliable:true});connection.on('open',()=>{connected=true;status('В комнате',true);connection.send({type:'join',name:guestName,token});setup='guest';render()});connection.on('data',m=>{if(m.type==='state'){state=m.state;me=m.you;hand=m.hand||[];setup='guest';render()}else if(m.type==='error'){msg(m.text)} });connection.on('close',()=>{connected=false;status('Нет связи с ведущим');render()});connection.on('error',()=>{connected=false;status('Ошибка сети');render()})});peer.on('error',e=>{connected=false;setup='guestgate';status('Не удалось подключиться');msg('Комната не найдена или недоступна.');render()});render()}
function guestSend(m){if(connection?.open)connection.send(m);else msg('Нет связи с ведущим.')}
function hostStart(){if(!host||state.phase!=='lobby')return;const ps=state.players;if(ps.length<2||ps.some(p=>!p.role)){msg('Нужно минимум 2 игрока, и каждому — роль.');return}if(ps.some(p=>!p.online)){msg('Один из участников не в сети.');return}state.phase='playing';state.players=shuffle(ps);state.turn=0;state.moves=0;state.lights=[];state.sparks=0;state.storm=0;state.shield=0;state.round=1;state.goal=Math.max(8,ps.length+3);for(const p of state.players){p.position=0;p.powerUsed=false;p.pendingSteps=0;p.plays=0;drawCards(p)}log('🎅 Дед Мороз','Почта открыта! Первый игрок начинает ход.');publish()}
function usePower(p){if(p.powerUsed){sendConn(p.token,{type:'error',text:'Способность уже использована.'});return}const r=role(p.role);if(!r)return;
 p.powerUsed=true;const type=r[4],val=r[5];if(type==='steps')p.pendingSteps+=val;else if(type==='spark')state.sparks+=val;else if(type==='storm')state.storm=Math.max(0,state.storm+val);else if(type==='shield')state.shield+=val;else if(type==='mix'){if(p.role==='scout'){state.sparks++;state.storm=Math.max(0,state.storm-1)}else{state.sparks+=2;state.shield++}}
 log(r[1]+' '+p.name,'Применена способность: '+r[3]);checkEnd();publish()}
function playCard(p,m){const idx=Number(m.index);if(!Number.isInteger(idx)||idx<0||idx>=3)return;const k=p.hand[idx],card=C[k];if(!card)return;
 let dest=null;if(card.kind==='portal'){dest=Number(m.target);if(!Object.prototype.hasOwnProperty.call(TOWN,dest))return}
 const before=p.position;let steps=card.step+p.pendingSteps;p.pendingSteps=0;
 if(card.kind==='portal')p.position=dest;else p.position=((p.position+steps)%12+12)%12;
 if(card.kind==='spark')state.sparks+=card.amount;
 if(card.kind==='storm')state.storm=Math.max(0,state.storm+card.amount);
 if(card.kind==='shield')state.shield+=card.amount;
 let effect='';const tile=p.position;
 if(TOWN[tile]){if(!state.lights.includes(tile)){state.lights.push(tile);state.sparks+=2;effect='🎁 Доставлен подарок в '+TOWN[tile][1]+' город (+2 ✨)!'}else{state.sparks++;effect='✨ Город уже светится (+1 ✨)' }}
 else if([1,4,7,10].includes(tile)){state.sparks++;effect='Пойманы звёздные искры (+1 ✨)'}
 else if([3,6,9].includes(tile)){if(state.shield>0){state.shield--;effect='🛡️ Щит остановил метель!'}else{state.storm++;effect='🌨️ Метель усилилась!'}}
 else if(tile===0){state.sparks++;effect='📮 Вернулся в штаб (+1 ✨)'}
 p.hand.splice(idx,1);p.hand.push(DECK[Math.floor(Math.random()*DECK.length)]);p.plays++;state.moves++;
 log(role(p.role)?.[1]+' '+p.name,card.emoji+' '+card.name+' · '+effect);
 if(!checkEnd()){
  state.turn=(state.turn+1)%state.players.length;
  if(state.turn===0){state.round++;state.storm++;log('🌨️ Погода','Новый круг! Метель +1.');checkEnd()}
 }
 publish();
}
function checkEnd(){if(state.phase!=='playing')return true;if(state.storm>=10){state.phase='lost';log('🌨️ Метель','Почта замёрзла. Попробуйте ещё раз!');return true}if(state.lights.length===4&&state.sparks>=state.goal&&state.players.every(p=>p.plays>=1)){state.phase='won';log('🎉 Команда','Все подарки доставлены — Новый год спасён!');return true}return false}
function hostSkip(){if(!host||state.phase!=='playing')return;const p=state.players[state.turn];if(!p)return;p.plays++;state.moves++;log('⏩ Ведущий','Ход '+p.name+' пропущен.');if(!checkEnd()){state.turn=(state.turn+1)%state.players.length;if(state.turn===0){state.round++;state.storm++;log('🌨️ Погода','Новый круг! Метель +1.');checkEnd()}}publish()}
function hostReset(){if(!host)return;const old=state.players;state=newState();state.players=old.map(p=>({...p,role:null,position:0,powerUsed:false,plays:0,hand:[]}));publish()}
function render(){if(!state){if(host){APP.innerHTML=`<div class="panel namebox"><div class="eyebrow">Создаём игровую комнату</div><h1>🎄 Готовим колоду…</h1><p>Проверяем подключение.</p></div>`}else if(setup==='guestgate'||(room&&setup==='intro'))renderGate();else if(setup==='connecting')APP.innerHTML=`<div class="panel namebox"><div style="font-size:72px">🦌</div><h2>Подключаемся…</h2><p>Убедись, что ведущий открыл комнату.</p></div>`;else renderIntro();return}if(state.phase==='lobby')renderLobby();else if(['won','lost'].includes(state.phase))renderEnd();else renderGame()}
function renderIntro(){APP.innerHTML=`<div class="panel hero"><div><div class="eyebrow">Новый год · Командная игра · Искусственный интеллект</div><h1>Спасти<br>Снежную почту! 🎄</h1><p>Одна общая доска, у каждого — свои карты и фишка. Делайте ходы по очереди и доставьте подарки в 4 города!</p><div class="stats"><span class="stat">👥 <b>2–10</b> игроков</span><span class="stat">🃏 <b>3</b> карты в руке</span><span class="stat">⏳ <b>15–25</b> минут</span></div><div class="actions">${button('🎮 Создать игру','create')}<button class="btn alt" data-act="showJoin">🔗 Войти по коду</button></div><div class="steps"><span>1. Выбери роль</span><span>2. Разыграй карту</span><span>3. Спаси Новый год!</span></div></div><div class="hero-illustration" aria-hidden="true"><div class="sample"><span class="emoji">🦌</span><b>Экспресс-олень</b></div><div class="sample"><span class="emoji">🔎</span><b>Фактчек</b></div><div class="sample"><span class="emoji">🎁</span><b>4 города</b></div><div class="sample"><span class="emoji">🤖</span><b>Командный ИИ</b></div></div></div>`}
function renderGate(){APP.innerHTML=`<div class="panel namebox"><div class="eyebrow">Командная игра · Комната ${escape(room||'')}</div><h1>🎁 Ты в команде!</h1><p>Напиши имя, чтобы выбрать свою роль.</p><form id="joinForm"><input class="input" id="nickname" maxlength="18" autocomplete="nickname" placeholder="Твоё имя" required value="${escape(guestName)}"><div style="margin-top:14px"><button class="btn" type="submit">🚀 Войти в игру</button></div></form><p class="tiny" style="margin-top:20px">Ведущий должен держать комнату открытой.</p></div>`}
function renderLobby(){const ps=state.players||[],mine=ps.find(p=>p.id===me);const roles=ROLES.map(r=>{const owner=ps.find(p=>p.role===r[0]);const my=mine?.role===r[0];return `<button class="role ${my?'mine':''}" data-act="claim" data-val="${r[0]}" ${host||(!my&&owner)?'disabled':''}><span class="emoji">${r[1]}</span><span class="title">${r[2]}</span><small>${owner?'✅ '+escape(owner.name):r[3]}</small></button>`}).join('');const ready=ps.length>=2&&ps.every(p=>p.role&&p.online);APP.innerHTML=`<div class="panel"><div class="banner"><div><div class="eyebrow">Командная комната ${host?'· Ведущий':'· Игрок'}</div><h2>🎄 Собираем команду</h2><p style="margin:0">${host?'Отправьте ученикам одну ссылку':'Выбери свободную роль. У каждой — особая способность.'}</p></div><div><div class="tiny">Код комнаты</div><div class="code">${escape(room)}</div></div></div><div class="actions" style="margin-top:20px">${host?button('🔗 Скопировать ссылку','copy','false'):''}<span class="pill">👥 ${ps.length} / 10 игроков</span><span class="pill">🎭 ${ps.filter(p=>p.role).length} ролей занято</span></div><div style="margin:18px 0 12px"><h3>Выбери героя</h3><div class="roles">${roles}</div></div><h3>Команда</h3><div class="roster">${ps.length?ps.map(p=>`<span class="person ${!p.online?'offline':''} ${p.id===me?'mine':''}">${role(p.role)?.[1]||'⏳'} ${escape(p.name)}${!p.online?' (вне сети)':''}</span>`).join(''):'<span class="muted">Ждём участников по ссылке…</span>'}</div><div class="actions" style="margin-top:23px">${host?button(ready?'🚀 Начать партию':'⏳ Ждём команду','start',false,ready?'':'disabled'):`<span class="pill">${mine?.role?'✅ Роль выбрана. Ждём ведущего.':'👆 Выбери роль выше'}</span>`}</div></div>`}
function rosterHtml(){return state.players.map((p,i)=>`<span class="person ${state.turn===i&&state.phase==='playing'?'active':''} ${p.id===me?'mine':''} ${!p.online?'offline':''}">${role(p.role)?.[1]||'🧑'} ${escape(p.name)}${p.plays?' ✓':''}</span>`).join('')}
function boardHtml(){const tiles=Object.entries(TILE).map(([iStr,t])=>{const i=Number(iStr);const pawn=state.players.filter(p=>p.position===i).map(p=>`<span class="token" title="${escape(p.name)}">${role(p.role)?.[1]||'🧑'}</span>`).join('');return `<div class="tile ${t[2]} ${state.lights.includes(i)?'lit':''}" style="grid-area:${COORD[i][0]}/${COORD[i][1]}" title="${escape(t[1])}"><span class="tile-em">${state.lights.includes(i)?'🎇':t[0]}</span><div class="tile-name">${escape(t[1])}</div><div class="tokens">${pawn}</div></div>`}).join('');return `<div class="board" aria-label="Игровое поле с 12 клетками">${tiles}<div class="center"><span class="sleigh anim-bob">🛷</span><b>${state.lights.length}/4 города</b><small>Помоги Деду Морозу!</small></div></div>`}
function gameMetrics(){return `<div class="metrics"><div class="metric"><div class="desc">✨ Искры</div><div class="num">${state.sparks} / ${state.goal}</div><div class="meter"><div class="fill" style="width:${Math.min(100,state.sparks/state.goal*100)}%"></div></div></div><div class="metric"><div class="desc">🌨️ Метель</div><div class="num">${state.storm} / 10</div><div class="meter"><div class="fill storm" style="width:${state.storm*10}%"></div></div></div></div>`}
function gameSidebar(){const p=state.players[state.turn],mine=state.players.find(x=>x.id===me),isTurn=mine?.id===p?.id;const handHtml=mine?.role?`<h3>🃏 Твои карты</h3><div class="hand">${hand.map((k,i)=>{const c=C[k];return `<button class="gamecard" data-act="card" data-val="${i}" ${!isTurn?'disabled':''}><span class="emoji">${c.emoji}</span><span class="name">${c.name}</span><span class="effect">${c.label}</span></button>`}).join('')}</div><p class="hint">${isTurn?'Выбери одну карту — это и будет твой ход.':'Карты пока закрыты для хода. Ждём твоей очереди.'}</p>`:`<p class="muted">Ведущий наблюдает за полем. Ходят ученики.</p>`;
 const currentRole=role(mine?.role);const powerHtml=mine&&currentRole?`<div class="power"><div><b>${currentRole[1]} Способность</b><div class="hint">${currentRole[3]} · один раз за игру</div></div><button class="btn mint small" data-act="power" ${!isTurn||mine.powerUsed?'disabled':''}>${mine.powerUsed?'✓ Готово':'Применить'}</button></div>`:'';
 return `<div class="panel"><div class="turn-card"><div class="eyebrow" style="color:var(--gold);margin-bottom:5px">Круг ${state.round} · Ход ${state.moves+1}</div><h3>${role(p.role)?.[1]||'🎲'} ${escape(p.name)} — ${isTurn?'твой ход!':'ходит сейчас'}</h3><div class="tiny">${isTurn?'Сначала можно применить способность, затем выбрать карту.':'Каждый игрок делает по одному ходу за круг.'}</div></div>${powerHtml}${handHtml}<h3>📜 Последние события</h3><div class="eventlog">${state.log.map(e=>`<div class="event"><strong>${escape(e.who)}</strong><div>${escape(e.text)}</div></div>`).join('')}</div></div>`}
function renderGame(){APP.innerHTML=`<div class="banner" style="margin-bottom:14px"><div><div class="eyebrow">Спасение новогодней почты</div><h2>🎁 Доставьте подарки!</h2></div><span class="pill">🛡️ Щиты: ${state.shield}</span></div><div class="split"><div class="panel board-wrap">${gameMetrics()}${boardHtml()}<div class="roster">${rosterHtml()}</div>${host?`<div class="actions" style="margin-top:17px"><button class="btn alt small" data-act="skip">⏭️ Пропустить ход</button><button class="btn alt small" data-act="reset">🔁 Новая партия</button><button class="btn alt small" data-act="copy">🔗 Ссылка</button></div>`:''}</div>${gameSidebar()}</div><div class="panel" style="margin-top:14px"><div class="eyebrow">Правила в 15 секунд</div><div class="ruleline">🃏 В свой ход сыграй <b>одну карту</b>. Фишка переместится по кругу.</div><div class="ruleline">🎁 Посети <b>все четыре города</b>, собери <b>${state.goal} искр</b> и дай каждому сделать ход.</div><div class="ruleline">🌨️ Не дай метели дойти до <b>10</b>. Фактчек и щиты помогут.</div></div>`}
function renderEnd(){let won=state.phase==='won';APP.innerHTML=`<div class="panel win"><div class="eyebrow">${won?'Миссия выполнена!':'Метель победила'}</div><div class="party">${won?'🎄🎁🎉':'🌨️🛷❄️'}</div><h1>${won?'Новый год спасён!':'Почта замёрзла!'}</h1><p>${won?'Вы вместе доставили подарки, собрали искры и победили цифровую метель. Это была настоящая команда!':'Не сдавайтесь! Попробуйте чаще защищаться от метели и быстрее доставлять подарки.'}</p><div class="stats" style="justify-content:center"><span class="stat">🎁 Города: <b>${state.lights.length}/4</b></span><span class="stat">✨ Искры: <b>${state.sparks}</b></span><span class="stat">🎲 Ходы: <b>${state.moves}</b></span></div><div class="roster" style="justify-content:center;margin:22px 0">${rosterHtml()}</div>${host?button('🔁 Ещё одну партию','reset'):button('🎉 Ура, команда!','cheer')}</div>`}
function showPortal(index){pendingIndex=index;$('modal').innerHTML=`<div class="overlay"><div class="modal"><div class="eyebrow">🌀 Телепорт-промпт</div><h2>Куда переместиться?</h2><p>Выбери один из четырёх городов.</p><div class="targets">${Object.entries(TOWN).map(([pos,v])=>`<button class="target" data-act="portal" data-val="${pos}">${v[0]}<br>${v[1]} ${state.lights.includes(Number(pos))?'✓':'🎁'}</button>`).join('')}</div><button class="btn alt small" data-act="close">Отмена</button></div></div>`}
function copyLink(){const url=playUrl();if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>msg('Ссылка скопирована!')).catch(()=>prompt('Скопируйте ссылку:',url))}else prompt('Скопируйте ссылку:',url)}
function joinByCode(){const c=prompt('Введи код комнаты ведущего:');if(!c)return;room=c.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);if(!room)return;history.replaceState(null,'',playUrl());setup='guestgate';render()}
function onAct(act,val){if(act==='create'){hostCreate();return}if(act==='showJoin'){joinByCode();return}if(act==='copy'){copyLink();return}if(act==='start'){hostStart();return}if(act==='reset'){if(host&&confirm('Начать новую партию? Текущий прогресс сбросится.'))hostReset();return}if(act==='skip'){if(host&&confirm('Пропустить ход текущего игрока?'))hostSkip();return}if(act==='claim'){guestSend({type:'claim',role:val});return}if(act==='power'){guestSend({type:'power'});return}if(act==='card'){const i=Number(val);if(C[hand[i]]?.kind==='portal'){showPortal(i)}else guestSend({type:'play',index:i});return}if(act==='portal'){guestSend({type:'play',index:pendingIndex,target:Number(val)});$('modal').innerHTML='';return}if(act==='close'){$('modal').innerHTML='';return}if(act==='cheer'){msg('🎉 Вы — лучшая команда!')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;onAct(b.dataset.act,b.dataset.val)});
document.addEventListener('submit',e=>{if(e.target.id==='joinForm'){e.preventDefault();connectGuest($('nickname').value)}});
if(room){setup='guestgate';render()}else{renderIntro()}
})();
</script></body></html>
